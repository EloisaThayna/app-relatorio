<style>
  :root{
    --bg:#faf8f4; --ink:#1c1b19; --muted:#7a756b; --line:#ece8e0; --card:#fff;
    --gold:#a8895c; --wa:#25D366;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
  .num{font-family:'Space Grotesk',system-ui;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit}
  textarea{resize:vertical}
  a{text-decoration:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #2f6fed;outline-offset:2px}

  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  header.top{position:sticky;top:0;z-index:30;background:rgba(250,248,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .htop{padding:calc(env(safe-area-inset-top) + 12px) 14px 10px}
  .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1.count{margin:1px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em}
  h1.count .of{color:#bdb6a8;font-weight:600}
  .sub{font-size:12.5px;color:var(--muted);margin-top:0}
  .topbtns{display:flex;gap:8px;margin-top:10px}
  .topbtns button{border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;justify-content:center;flex:1}
  .b-msg{background:#fff;border:1px solid #e6e1d7;color:#4a463f}
  .b-exp{background:var(--ink);color:#fff}
  .bar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:12px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}
  .legend .it{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b6760}
  .legend .it b{font-weight:700;color:#2a2823}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}

  .cfg{margin-top:12px;background:#fff;border:1px solid #e9e4da;border-radius:12px;padding:12px}
  .cfg .lbl{font-size:12.5px;font-weight:600;color:#4a463f;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .cfg textarea{width:100%;border:1px solid #e3ddd2;border-radius:8px;padding:9px 11px;font-size:13.5px;color:#2a2823}
  .cfg .hint{font-size:11.5px;color:#9a958b;margin-top:6px}
  .cfg code{background:#f1ede4;padding:1px 5px;border-radius:4px}

  .filters{padding:12px 14px 2px}
  .srch{position:relative;margin-bottom:10px}
  .srch input{width:100%;border:1px solid #e6e1d7;background:#fff;border-radius:10px;padding:11px 12px 11px 36px;font-size:14px}
  .srch svg{position:absolute;left:11px;top:12px;color:#b6b0a4}
  .row2{display:flex;gap:8px;margin-bottom:11px}
  .row2 select{flex:1;border:1px solid #e6e1d7;background:#fff;border-radius:10px;padding:10px 11px;font-size:13.5px;color:#4a463f}
  .pend{display:flex;align-items:center;gap:7px;border:1px solid #e6e1d7;background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;color:#4a463f;white-space:nowrap}
  .pend.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pend input{accent-color:#e8a33d;width:16px;height:16px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .chip{display:flex;align-items:center;gap:6px;border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600;background:#fff;color:#5a564e;border:1px solid #e6e1d7;white-space:nowrap;flex:0 0 auto}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .dot{border-radius:99px;width:8px;height:8px}

  main{padding:8px 0 90px}
  .empty{text-align:center;padding:50px 20px;color:#9a958b;font-size:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;border-left:4px solid #9aa0a6}
  .chead{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
  .nome{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
  .meta{display:flex;gap:13px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:#857f74}
  .meta span{display:flex;align-items:center;gap:4px}
  .meta .lista{color:#b3ada1}
  .warn{font-size:11.5px;color:#b1453b;font-weight:500;margin-top:10px}

  .tel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
  .wa{display:flex;align-items:center;gap:7px;background:var(--wa);color:#fff;font-weight:700;font-size:14px;padding:11px 16px;border-radius:10px}
  .telnum{font-family:'Space Grotesk',system-ui;font-variant-numeric:tabular-nums;font-size:14px;color:#3a372f;font-weight:500}
  .cpy{background:#f4f1ea;border:1px solid #e8e3d8;border-radius:8px;padding:7px 10px;font-size:12px;color:#6b6760;display:flex;align-items:center;gap:5px}
  .usado{font-size:11px;color:#16703f}

  .stbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
  .stbtn{border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;border:1px solid transparent}

  .noterow{margin-top:11px}
  .noteopen{background:none;border:none;font-size:12.5px;color:var(--gold);font-weight:600;padding:0}
  .noterow textarea{width:100%;border:1px solid var(--line);background:#fcfbf8;border-radius:9px;padding:9px 11px;font-size:13.5px;color:#2a2823}
  .upd{font-size:11px;color:#bdb6a8;margin-top:5px}

  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
</style>
</head>

const STATUSES = [
  { id:"novo",          label:"Não contatado", dot:"#9aa0a6", bg:"#f1f1ef", fg:"#5f6368", ring:"#d8d8d4" },
  { id:"sem_resposta",  label:"Sem resposta",  dot:"#c98a2b", bg:"#fbf1df", fg:"#8a5a12", ring:"#eccf97" },
  { id:"conversando",   label:"Conversando",   dot:"#2f6fed", bg:"#e7effd", fg:"#1f4fb0", ring:"#bcd2f7" },

  { id:"sem_interesse", label:"Sem interesse", dot:"#b1453b", bg:"#f9e8e6", fg:"#8a3229", ring:"#e7b6b0" },
  { id:"numero_errado", label:"Número errado", dot:"#6b6b6b", bg:"#eceae6", fg:"#4a4a4a", ring:"#cfccc5" },
];
const ST = Object.fromEntries(STATUSES.map(s=>[s.id,s]));
const SKEY="reativa_estado_v1", CKEY="reativa_config_v1";
const DEFAULT_MSG="Olá {nome}! Aqui é o Alison. Tudo bem? Estou entrando em contato para falar sobre o seu retorno. Você teria um minuto?";

let estado={}, cfg={msg:DEFAULT_MSG};
try{ estado=JSON.parse(localStorage.getItem(SKEY))||{} }catch(e){ estado={} }
try{ const c=JSON.parse(localStorage.getItem(CKEY)); if(c) cfg=c }catch(e){}

let filtroStatus="todos", filtroLista="todas", busca="", soPendentes=false, cfgOpen=false;

function saveEstado(){ try{ localStorage.setItem(SKEY, JSON.stringify(estado)) }catch(e){ toast("Erro ao salvar — verifique o armazenamento do navegador") } }
function saveCfg(){ try{ localStorage.setItem(CKEY, JSON.stringify(cfg)) }catch(e){} }
function reg(id){ return estado[id] || {status:"novo",nota:"",atualizado:null} }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function digits(t){ return String(t).replace(/\D/g,"") }
function nomeProper(n){ return String(n||"").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\bD([aeo]s?)\b/g,"d$1") }
function fmtTel(t){ const d=digits(t); if(d.length===11) return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7); if(d.length===10) return "("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6); return t }
function telSuspeito(tels){ return tels.every(t=>digits(t).length!==11) }
function waLink(tel,nome){
  const d=digits(tel); const full=d.startsWith("55")?d:"55"+d;
  const pn=(nome||"").split(" ")[0]; const cap=pn?pn.charAt(0)+pn.slice(1).toLowerCase():"";
  const msg=(cfg.msg||DEFAULT_MSG).replace(/\{nome\}/g,cap);
  return "https://wa.me/"+full+"?text="+encodeURIComponent(msg);
}
function fmtData(ts){ return new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) }

function stats(){
  const c={total:CONTATOS.length,trabalhados:0}; STATUSES.forEach(s=>c[s.id]=0);
  CONTATOS.forEach(k=>{ const st=reg(k.id).status; c[st]=(c[st]||0)+1; if(st!=="novo") c.trabalhados++ });
  return c;
}
function filtrar(){
  const q=busca.trim().toLowerCase();
  return CONTATOS.filter(k=>{
    const st=reg(k.id).status;
    if(filtroStatus!=="todos" && st!==filtroStatus) return false;
    if(filtroLista!=="todas" && k.lista!==filtroLista) return false;
    if(soPendentes && st!=="novo") return false;
    if(q){ const hay=(k.nome+" "+k.matricula+" "+k.telefones.join(" ")+" "+(k.cidade||"")).toLowerCase(); if(!hay.includes(q)) return false }
    return true;
  });
}

};

function render(){
  const s=stats();
  const segs=STATUSES.filter(x=>x.id!=="novo").map(x=>{ const w=s.total?(s[x.id]/s.total)*100:0; return w>0?'<div style="width:'+w+'%;background:'+x.dot+'" title="'+x.label+': '+s[x.id]+'"></div>':'' }).join("");
  const legend=STATUSES.map(x=>'<div class="it"><span class="dot" style="background:'+x.dot+'"></span><b>'+s[x.id]+'</b> '+x.label+'</div>').join("");
  const chips='<button class="chip'+(filtroStatus==="todos"?" on":"")+'" data-act="fstatus" data-v="todos"><span class="dot" style="background:#1c1b19"></span>Todos ('+s.total+')</button>'+
    STATUSES.map(x=>'<button class="chip'+(filtroStatus===x.id?" on":"")+'" data-act="fstatus" data-v="'+x.id+'"><span class="dot" style="background:'+x.dot+'"></span>'+x.label+' ('+s[x.id]+')</button>').join("");

  const lista=filtrar();
  const cards = lista.length? lista.map(cardHTML).join("") : '<div class="empty">Nenhum contato com esses filtros. Ajuste a busca acima.</div>';

  document.getElementById("app").innerHTML =
  '<header class="top"><div class="htop">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'+
      '<div><div class="eyebrow">Reativações · Alison</div>'+
      '<h1 class="count num">'+s.trabalhados+'<span class="of"> / '+s.total+'</span></h1>'+
      '<div class="sub">contatos trabalhados</div></div></div>'+
    '<div class="topbtns">'+
      '<button class="b-msg" data-act="togglecfg">'+ICN.cfg+' Mensagem</button>'+
      '<button class="b-exp" data-act="export">'+ICN.dl+' Exportar relatório</button>'+
    '</div>'+
    '<div class="bar">'+segs+'</div>'+
    '<div class="legend">'+legend+'</div>'+
    (cfgOpen?cfgHTML():"")+
  '</div></header>'+
  '<div class="wrap"><div class="filters">'+
    '<div class="srch">'+ICN.search+'<input id="busca" type="search" placeholder="Buscar nome, matrícula ou telefone" value="'+esc(busca)+'"></div>'+
    '<div class="row2">'+
      '<select data-act="flista"><option value="todas"'+(filtroLista==="todas"?" selected":"")+'>Todas as listas</option><option value="Lista 1"'+(filtroLista==="Lista 1"?" selected":"")+'>Lista 1</option><option value="Lista 2"'+(filtroLista==="Lista 2"?" selected":"")+'>Lista 2</option></select>'+
      '<label class="pend'+(soPendentes?" on":"")+'"><input type="checkbox" data-act="pend" '+(soPendentes?"checked":"")+'>Só pendentes</label>'+
    '</div>'+
    '<div class="chips">'+chips+'</div>'+
  '</div>'+
  '<main>'+cards+'</main></div>';

  const b=document.getElementById("busca");
  if(b){ b.oninput=()=>{ busca=b.value; const start=b.selectionStart; renderListOnly(); }; }
}

function cfgHTML(){
  return '<div class="cfg"><div class="lbl">Mensagem padrão do WhatsApp <button data-act="togglecfg" style="color:#9a958b;font-size:18px;line-height:1">&times;</button></div>'+
  '<textarea data-act="msg" rows="3">'+esc(cfg.msg)+'</textarea>'+
  '<div class="hint">Use <code>{nome}</code> para inserir o primeiro nome automaticamente.</div></div>';
}

function cardHTML(k){
  const r=reg(k.id); const st=ST[r.status]||ST.novo; const susp=telSuspeito(k.telefones);
  const badges='<span class="badge" style="color:'+st.fg+';background:'+st.bg+'">'+st.label+'</span>'+
    (k.vezes==="2x"?'<span class="badge" style="color:#8a5a12;background:#fbf1df">2ª reativação</span>':'');
  const meta='<div class="meta"><span>#'+esc(k.matricula)+'</span>'+
    (k.cidade?'<span>'+esc(nomeProper(k.cidade))+'</span>':'')+
    '<span>saiu '+esc(k.data_eliminacao)+'</span><span class="lista">'+esc(k.lista)+'</span></div>';
  const tels=k.telefones.map(tel=>{
    const used=r.telUsado===tel?'<span class="usado">✓ usado</span>':'';
    return '<div class="tel"><a class="wa" href="'+waLink(tel,k.nome)+'" target="_blank" rel="noreferrer" data-act="wa" data-id="'+k.id+'" data-tel="'+tel+'">'+ICN.wa+' WhatsApp</a>'+
      '<span class="telnum">'+fmtTel(tel)+'</span>'+
      '<button class="cpy" data-act="copy" data-tel="'+tel+'">'+ICN.copy+' Copiar</button>'+used+'</div>';
  }).join("");
  const stbtns=STATUSES.map(x=>{ const on=r.status===x.id;
    return '<button class="stbtn" data-act="status" data-id="'+k.id+'" data-v="'+x.id+'" style="background:'+(on?x.dot:x.bg)+';color:'+(on?"#fff":x.fg)+';border-color:'+(on?x.dot:"transparent")+'">'+x.label+'</button>';
  }).join("");
  const noteOpen=!!r.nota;
  const note='<div class="noterow" data-id="'+k.id+'">'+
    (noteOpen?'<textarea data-act="nota" data-id="'+k.id+'" rows="2" placeholder="O que aconteceu...">'+esc(r.nota)+'</textarea>'
      :'<button class="noteopen" data-act="opennote" data-id="'+k.id+'">+ Anotar o que aconteceu</button>')+
    (r.atualizado?'<div class="upd">Atualizado '+fmtData(r.atualizado)+'</div>':'')+'</div>';
  return '<div class="card" id="card-'+k.id+'" style="border-color:'+(r.status!=="novo"?st.ring:"var(--line)")+';border-left-color:'+st.dot+'">'+
    '<div class="chead"><span class="nome">'+esc(nomeProper(k.nome))+'</span>'+badges+'</div>'+meta+
    (susp?'<div class="warn">⚠ Número fora do padrão — confira antes de enviar.</div>':"")+
    tels+'<div class="stbtns">'+stbtns+'</div>'+note+'</div>';
}

function renderListOnly(){
  const lista=filtrar();
  const main=document.querySelector("main");
  if(main) main.innerHTML = lista.length? lista.map(cardHTML).join("") : '<div class="empty">Nenhum contato com esses filtros. Ajuste a busca acima.</div>';
}

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1400); }

function exportCSV(){
  const head=["matricula","nome","telefones","cidade","lista","vezes_cancelou","data_entrada","data_eliminacao","status","anotacao","atualizado_em"];
  const rows=CONTATOS.map(k=>{ const r=reg(k.id); const at=r.atualizado?fmtData(r.atualizado):"";
    const vals=[k.matricula,nomeProper(k.nome),k.telefones.map(fmtTel).join(" | "),k.cidade||"",k.lista,k.vezes||"",k.data_entrada,k.data_eliminacao,(ST[r.status]||{}).label||"",(r.nota||"").replace(/\n/g," "),at];
    return vals.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",");
  });
  const csv="\uFEFF"+[head.join(","),...rows].join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="relatorio_reativacoes_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ===== eventos (delegação) =====
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, v=el.dataset.v, tel=el.dataset.tel;
  if(act==="togglecfg"){ cfgOpen=!cfgOpen; render(); }
  else if(act==="export"){ exportCSV(); }
  else if(act==="fstatus"){ filtroStatus=v; render(); }
  else if(act==="status"){ const cur=reg(id); estado[id]={...cur,status:v,atualizado:Date.now()}; saveEstado(); render(); }
  else if(act==="opennote"){ const cur=reg(id); estado[id]={...cur,nota:cur.nota||" "}; renderListOnly(); const ta=document.querySelector('textarea[data-act="nota"][data-id="'+id+'"]'); if(ta){ta.focus();ta.value="";} }
  else if(act==="copy"){ const t=digits(tel); navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast("Número copiado")).catch(()=>toast(fmtTel(tel))); }
  else if(act==="wa"){ const cur=reg(id); const nx={...cur,telUsado:tel,atualizado:Date.now()}; if(cur.status==="novo") nx.status="sem_resposta"; estado[id]=nx; saveEstado(); setTimeout(render,300); }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="flista"){ filtroLista=el.value; render(); }
  else if(el.dataset.act==="pend"){ soPendentes=el.checked; render(); }
});
let notaT;
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="nota"){ const id=el.dataset.id; const cur=reg(id); estado[id]={...cur,nota:el.value,atualizado:Date.now()}; clearTimeout(notaT); notaT=setTimeout(saveEstado,400); }
  else if(el.dataset.act==="msg"){ cfg.msg=el.value; clearTimeout(notaT); notaT=setTimeout(saveCfg,400); }
});

render();
</script>
